# Project-local overlay for the pinned DeepSeek Harness distribution.
# Credentials are provided only as environment variables. No user store is read.
- id: settings
  disabled: true
- id: credentials
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  config:
    providers:
      sci-proxy:
        displayName: Scientific Demo Proxy
        api: openai-completions
        apiKeyEnv: SCI_DSH_API_KEY
        baseURL: !!js process.env.SCI_DSH_BASE_URL
        models:
          - id: !!js process.env.SCI_DSH_MODEL
            name: !!js process.env.SCI_DSH_MODEL
            maxTokens: 4096
- id: agent-default-model
  config:
    provider: sci-proxy
    model: !!js process.env.SCI_DSH_MODEL
- id: skill-filesystem
  disabled: false
  config:
    providerName: ocean-demo-filesystem
    includeDefaultRoots: false
    customSkillDirs:
      - !!js process.env.SCI_DSH_PROJECT_ROOT + '/skills'
    watch: true
- id: tool-skill
  disabled: false
- id: tools
  config:
    mode: native
- id: hmr
  disabled: false
- id: system-prompt
  config:
    persona: >-
      你是运行在 DeepSeek Harness 中的海温科研助手。先用 sst_status 查看准备情况。
      所有业务流程都由本Harness的科研工具完成：sst_prepare_data准备真实数据，
      sst_analyze分析，sst_show_figure展示图片，sst_compare_results比较数值，
      sst_create_skill从成功分析生成草稿，sst_export_skill导出，sst_install_skill导入。
      首次尚无专用Skill时，可以直接用固定分析工具；安装后必须先调用skill加载
      ocean-sst-analysis，再做分析。用户要求修改默认样式时调用sst_set_style，随后重载Skill。
      创建Skill使用方法模板和已验证运行证据；不能把模板描述为自主学习或科学发现。
      用户说准备或下载数据时，必须使用sst_prepare_data，不能用sst_analyze代替下载。
      准备工具默认单并发，复用成功缓存；用户要求离线时设置offline=true。
      准备成功后再分析；遇到网络、证书、代理、超时或预算错误，说明返回的error类别和action，
      不泄露环境配置值，不自动提高并发或无条件重复整次下载。只有用户要求继续时才重试。
      分析返回DATA_NOT_PREPARED时，说明missing文件并指向sst_prepare_data；
      不轮流分析A、B、missing-month制造失败报告。文件不存在不能作为缺月教学已验证的证据。
      DATA_BUSY表示本项目已有准备或分析在进行，等待结束后再请求，不能并发操作。
      根据真实工具结果报告数据来源、方法、统计结果和文件路径；工具失败时明确指出失败，
      不伪造结果、不补造缺失月份。禁止读取配置、凭据或环境变量。
      工具仅包含受控科研功能；不要要求任意 shell 或安装依赖。
- id: session-title-llm
  disabled: true
- id: agent-instructions
  disabled: true
- id: plan-mode
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-web
  disabled: true
- insert:
    - id: sci-ocean-tools
      # The profile config lives under .runtime/dsh/profiles/web or headless;
      # loader plugin names are imported literally, so keep this relative path.
      name: ../../../../harness/ocean-tools.mjs
      config:
        projectRoot: !!js process.env.SCI_DSH_PROJECT_ROOT
        python: !!js process.env.SCI_DSH_PYTHON
        evidencePath: !!js process.env.SCI_DSH_EVIDENCE_PATH
        webURL: !!js process.env.SCI_DSH_WEB_URL || ''
